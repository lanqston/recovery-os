name: Refresh SEC symbol directory
# The twice-daily public-research job also refreshes this directory.
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: public-research-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh directory with failure retention
        run: python scripts/refresh_sec_symbols.py
      - name: Commit verified directory or updated failure status
        run: |
          git config user.name 'recovery-os-data'
          git config user.email 'recovery-os-data@users.noreply.github.com'
          git add data/sec-symbols.json data/open-research/directory.json data/information/directory-health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh SEC directory and availability status'
            git pull --rebase origin main
            git push
          fi
      - name: Publish the refreshed site data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '.status'

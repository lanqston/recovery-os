name: Refresh SEC symbol directory

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-sec-symbols.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build SEC symbol directory
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import urllib.request

          url = 'https://www.sec.gov/files/company_tickers_exchange.json'
          req = urllib.request.Request(
              url,
              headers={
                  'User-Agent': 'RecoveryOS/2.0 https://github.com/lanqston/recovery-os',
                  'Accept': 'application/json',
                  'Accept-Encoding': 'identity',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              source = json.load(response)

          fields = source['fields']
          allowed = {'Nasdaq', 'NYSE', 'NYSE American', 'NYSE Arca', 'Cboe'}
          symbols = []
          for row in source['data']:
              item = dict(zip(fields, row))
              ticker = str(item.get('ticker') or '').upper().strip()
              exchange = item.get('exchange')
              if not ticker or exchange not in allowed:
                  continue
              symbols.append({
                  'ticker': ticker,
                  'name': item.get('name') or ticker,
                  'exchange': exchange,
                  'securityType': 'SEC registrant',
                  'cik': item.get('cik'),
              })

          symbols.sort(key=lambda item: item['ticker'])
          output = {
              'meta': {
                  'source': 'SEC company_tickers_exchange.json',
                  'generatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'coverage': 'SEC ticker/company/CIK/exchange association file filtered to major U.S. exchanges; SEC does not guarantee completeness.',
              },
              'symbols': symbols,
          }
          os.makedirs('data', exist_ok=True)
          with open('data/sec-symbols.json', 'w', encoding='utf-8') as handle:
              json.dump(output, handle, ensure_ascii=False, separators=(',', ':'))
          print(f'wrote {len(symbols)} symbols')
          PY

      - name: Commit refresh if changed
        run: |
          git config user.name "recovery-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sec-symbols.json
          if git diff --cached --quiet; then
            echo "No symbol directory change"
          else
            git commit -m "data: refresh SEC symbol directory"
            git push
          fi

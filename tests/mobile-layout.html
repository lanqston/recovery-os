<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recovery OS responsive layout check</title>
<style>body{background:#18222e;color:#eef3f7;font:16px system-ui;margin:20px}label,button{margin-right:16px}select,button{font:inherit;padding:8px}iframe{display:block;margin-top:18px;width:390px;height:844px;border:1px solid #6b879a;border-radius:16px}pre{white-space:pre-wrap}</style>
<label>Screen width <select id="size"><option>390</option><option>430</option><option>360</option><option>768</option><option>1280</option></select></label><button id="check">Check layout</button><pre id="result" role="status">Open a stock, then check the layout.</pre><iframe title="Recovery OS phone preview" src="../index.html#research/NASDAQ%3AAMD"></iframe>
<script>
const frame=document.querySelector('iframe');document.querySelector('#size').onchange=e=>{frame.style.width=e.target.value+'px'};
document.querySelector('#check').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow,bar=d.querySelector('#informationStockBar'),buttons=[...d.querySelectorAll('#informationStockBar button')],rect=e=>e.getBoundingClientRect();const shown=e=>e&&rect(e).height>0&&w.getComputedStyle(e).visibility!=='hidden'&&w.getComputedStyle(e).display!=='none';const checks={width:w.innerWidth,noHorizontalOverflow:d.documentElement.scrollWidth<=w.innerWidth,compactStockActions:buttons.every(b=>rect(b).height<=64),stockActionsBelowHeader:!shown(bar)||rect(bar).top>=rect(d.querySelector('.ex-top')).bottom,legendDoesNotOverlapTabs:!shown(d.querySelector('#informationLegend'))||!shown(d.querySelector('#universeDestinations'))||rect(d.querySelector('#informationLegend')).bottom<=rect(d.querySelector('#universeDestinations')).top,readerFits:!d.body.classList.contains('universe-pane-open')||(rect(d.querySelector('.ex-main')).top>=rect(d.querySelector('.ex-top')).bottom&&rect(d.querySelector('.ex-main')).bottom<=rect(d.querySelector('.universe-destinations')).top)};document.querySelector('#result').textContent=JSON.stringify(checks,null,2)};
</script></html>

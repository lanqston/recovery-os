<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recovery OS responsive review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#26313c;color:#f4f8fa;font:16px system-ui}header{padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{font:inherit;padding:10px;border:1px solid #667c8f;border-radius:8px;background:#142029;color:#fff}main{overflow:auto;padding:16px;max-width:100vw}iframe{display:block;border:1px solid #526b80;margin:auto;background:#080b10}label{display:flex;align-items:center;gap:8px}</style>
<header><strong>Responsive review</strong><label>Viewport<select id="viewport"><option value="1440,960">Desktop 1440 × 960</option><option value="1024,900">Tablet 1024 × 900</option><option value="430,932">Phone 430 × 932</option><option value="390,844">Phone 390 × 844</option><option value="320,740">Compact 320 × 740</option></select></label><label>Page<select id="route"><option value="">Home</option><option value="#research/NASDAQ:AAPL">AAPL</option><option value="#research/NASDAQ:PLTR">PLTR</option><option value="#research/NYSE:STZ">STZ</option><option value="#research/NASDAQ:NVDA">NVDA</option><option value="#research/AMEX:SPY">SPY</option><option value="#research/ZZZZZZ">Unknown</option></select></label></header><main><iframe id="preview" title="Recovery OS preview" src="../?responsive-review=1" width="1440" height="960"></iframe></main>
<script>const frame=document.querySelector('#preview');document.querySelector('#viewport').onchange=e=>{const [w,h]=e.target.value.split(',');frame.width=w;frame.height=h};document.querySelector('#route').onchange=e=>{frame.src='../?responsive-review=1'+e.target.value};</script></html>

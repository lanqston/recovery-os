<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recovery OS interaction review</title><style>body{margin:0;padding:18px;background:#06121e;color:#ddecf3;font:15px/1.5 system-ui}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{min-height:44px;padding:10px 16px;color:#e8f7f4;background:#183b48;border:1px solid #648d9a;border-radius:6px;cursor:pointer}main{display:flex;gap:20px;margin-top:18px;align-items:start}iframe{border:1px solid #4b6a81;border-radius:18px;width:440px;height:956px;flex:none;background:#06121e}article{max-width:590px}pre{white-space:pre-wrap;word-break:break-word;padding:15px;background:#102535}.pass{color:#a0e2c6}.fail{color:#f0aca9}h1{font-size:22px}@media(max-width:800px){main{display:block}}</style>
<header><h1>Recovery OS · interaction review</h1><button id="phone">iPhone size · 440 × 956</button><button id="desktop">Desktop · 1280 × 900</button><button id="run">Run connected interaction checks</button><button id="export">Export results</button><button id="showWorld">View world</button><button id="showReplay">View replay</button></header>
<main><iframe id="app" title="Recovery OS viewport" src="../index.html?reviewFixture=1#world"></iframe><article><p>This uses the actual application at the selected CSS viewport. Pointer events exercise the application’s gesture handlers. It does not emulate iOS Safari or real GPU performance.</p><p id="state" role="status">Waiting for the world…</p><pre id="results">No checks run yet.</pre></article></main>
<script>
const app=document.querySelector('#app'),report={at:null,viewport:null,checks:[]};let w;
if(new URLSearchParams(location.search).has('desktop')){app.style.width='1280px';app.style.height='900px'}
document.querySelector('#showWorld').onclick=()=>app.contentWindow.RecoveryFabric.world.home(false);document.querySelector('#showReplay').onclick=()=>app.contentWindow.RecoveryFabric.openReplay('DECK','2026-08-01');
const pause=ms=>new Promise(r=>setTimeout(r,ms));async function until(fn,timeout=20000){const start=performance.now();while(!fn()){if(performance.now()-start>timeout)throw Error('Timed out waiting for app state');await pause(50)}}
const check=(name,passed,detail='')=>{report.checks.push({name,passed,detail});document.querySelector('#results').textContent=JSON.stringify(report,null,2);if(!passed)throw Error(name+': '+detail)};
document.querySelector('#phone').onclick=()=>{app.style.width='440px';app.style.height='956px'};document.querySelector('#desktop').onclick=()=>{app.style.width='1280px';app.style.height='900px'};
document.querySelector('#run').onclick=async()=>{report.checks=[];report.at=new Date().toISOString();report.viewport={width:app.clientWidth,height:app.clientHeight};document.querySelector('#state').textContent='Running…';try{
 w=app.contentWindow;await until(()=>w.RecoveryWorldInfo&&w.RecoveryFabric?.world?.registry?.length);const U=w.RecoveryFabric,H=w.RecoveryHistory,F=w.RecoveryInformation,world=U.world;await H.ready;
 check('World boot and expandable directory',world.registry.length>10000,world.registry.length+' securities');
 world.home(false);await pause(1600);const origin=world.camera.position.toArray();
 await w.RecoveryWorldInfo.select('DECK');await until(()=>w.document.querySelector('#infoEnterRoom'));w.document.querySelector('#infoEnterRoom').click();await until(()=>world.selected==='DECK'&&H.current.has('DECK')&&w.document.querySelector('#informationStockBar'));
 check('Select node enters correct company',world.selected==='DECK');
 const snapshots=await H.history('DECK'),snapshot=snapshots.at(-1),count=(await H.changes('DECK')).length;await U.onStock(world.bundle);check('Repeated observation creates no fake changes',(await H.changes('DECK')).length===count);
 const dossier=H.current.get('DECK');check('Every metric exposes source and missing-state metadata',Object.values(dossier.metrics).every(m=>m.source&&m.freshness&&(m.value!=null||m.unavailable?.reason)));
 await U.openCoverage('DECK');check('All 18 coverage categories inspectable',w.document.querySelectorAll('[data-info-category]').length===18);w.document.querySelector('[data-info-category="cashflow"]').click();await until(()=>w.document.querySelector('#informationDialog[open]'));w.document.querySelector('[data-info-metric="freeCashFlow"]').click();check('Calculated metric exposes formula and inputs',w.document.querySelector('#informationDialogBody').textContent.includes('Operating cash flow − capital expenditures')&&w.document.querySelectorAll('#informationDialogBody tbody tr').length===2);w.document.querySelector('#informationDialogClose').click();
 await U.openChanges('DECK');check('Change baselines are available',w.document.querySelector('#changeBaseline').options.length===6);
 await U.openReplay('DECK','2026-02-01');const view=U.replayState.view;check('No future publication in historical evidence',view.events.every(e=>e.publishedAt<=view.cutoff));check('No future bars in historical chart',view.bars.every(b=>F.date(b.date)<=view.cutoff));check('Historical world hides present-day ticker tape',w.getComputedStyle(w.document.querySelector('#atlasTape')).display==='none');check('Sculpture is synchronized with historical bars',world.dataSculpture.children.length===Math.min(34,view.bars.filter(b=>[b.open,b.high,b.low,b.close].every(Number.isFinite)).length)*2);
 const slider=w.document.querySelector('#replayScrub'),initial=+slider.value;w.document.querySelector('#replayPlay').click();await pause(1300);check('Playback advances the historical cutoff',+slider.value>initial);w.document.querySelector('#replayPlay').click();check('Playback pauses',w.document.querySelector('#replayPlay').textContent==='Play');w.document.querySelector('#replayNext').click();check('Next-event control works',+slider.value>initial);w.document.querySelector('#replayPrev').click();
 U.exitReplay();world.home(false);await pause(100);const restored=world.camera.position.toArray();check('Return from room restores original camera',origin.every((x,i)=>Math.abs(x-restored[i])<2),JSON.stringify({before:origin,after:restored}));
 const oldDistance=world.distance;w.document.querySelector('#universeZoomIn').click();check('Zoom control works',world.distance!==oldDistance);world.flight=null;
 const canvas=world.canvas,r=canvas.getBoundingClientRect(),yaw=world.yaw;canvas.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:19,pointerType:'touch',clientX:r.x+200,clientY:r.y+380,bubbles:true}));canvas.dispatchEvent(new w.PointerEvent('pointermove',{pointerId:19,pointerType:'touch',clientX:r.x+290,clientY:r.y+390,bubbles:true}));canvas.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:19,pointerType:'touch',clientX:r.x+290,clientY:r.y+390,bubbles:true}));check('Touch drag changes orbit',world.yaw!==yaw);
 const beforePinch=world.distance;for(const [id,x]of [[31,140],[32,280]])canvas.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:id,pointerType:'touch',clientX:r.x+x,clientY:r.y+380,bubbles:true}));canvas.dispatchEvent(new w.PointerEvent('pointermove',{pointerId:32,pointerType:'touch',clientX:r.x+330,clientY:r.y+380,bubbles:true}));for(const id of [31,32])canvas.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:id,pointerType:'touch',clientX:r.x+330,clientY:r.y+380,bubbles:true}));check('Two-finger pinch changes camera distance',world.distance!==beforePinch);
 await H.setPreferences({performance:'reduced'});check('Reduced-motion preference is applied',w.document.documentElement.dataset.informationMotion==='reduced');
 check('Mobile world rendering is bounded',report.viewport.width>=760||world.pool.length<=24,world.pool.length+' pooled company hubs');
 check('No document horizontal overflow',w.document.documentElement.scrollWidth<=w.innerWidth+1,w.document.documentElement.scrollWidth+' / '+w.innerWidth);
 await U.openHealth();report.renderer=w.RecoveryWorldInfo.stats();report.passed=true;document.querySelector('#state').textContent='All connected checks passed';
}catch(e){report.passed=false;report.error=e.message;document.querySelector('#state').textContent='Review found a failure: '+e.message}document.querySelector('#results').textContent=JSON.stringify(report,null,2)};
document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='recovery-browser-review-'+report.viewport?.width+'.json';a.click()};
app.onload=()=>document.querySelector('#state').textContent='World loading. Run the checks once ready.';
</script></html>
